[package]
name = "pclm-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "명령줄 pclm(C# src/Pclm.Cli) — 같은 인자에 같은 바이트의 출력과 종료 코드를 낸다(#8 ⑦)."
publish = false

[lib]
name = "pclm_cli"
path = "src/lib.rs"

# 문서와 도움말이 부르는 이름 그대로 나가게 한다(C# 의 AssemblyName pclm).
[[bin]]
name = "pclm"
path = "src/main.rs"

[dependencies]
pclm-core = { path = "../pclm-core" }
pclm-home = { path = "../pclm-home" }
pclm-excel = { path = "../pclm-excel" }

[dev-dependencies]
rusqlite.workspace = true
