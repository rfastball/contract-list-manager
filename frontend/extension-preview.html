<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>확장 개발 미리보기 · 계약 목록</title>
<link rel="stylesheet" href="/css/tokens.css">
<style>
  body { margin: 24px; background: var(--a-window); color: var(--a-ink); font: 14px/1.6 "Malgun Gothic", sans-serif; }
  h1 { font-size: 24px; margin-bottom: 8px; }
  form { display: flex; flex-wrap: wrap; gap: 16px; margin: 24px 0; }
  select, button { font: inherit; padding: 6px; }
  iframe { display: block; max-width: 100%; height: 320px; border: 1px solid var(--a-border); background: var(--a-card); }
  #fixture { max-width: 720px; margin-top: 24px; }
  #fixture input { display: block; width: 90%; margin: 8px 0; }
  :focus-visible { outline: 3px solid var(--a-primary); outline-offset: 2px; }
</style>
<h1>확장 개발 미리보기</h1>
<p>원본 툴바 팝업과 중계기 코드를 실행합니다. 지어낸 예시 화면과 메모리만 쓰며 실제 나라장터·Native Host·DB에는 연결하지 않습니다.</p>
<form>
  <label>상황 <select name="scenario">
    <option value="supported">연결됨 · 지원 화면</option><option value="unsupported">연결됨 · 수집 안 함</option>
    <option value="offline">연결 안 됨</option><option value="elsewhere">나라장터 아님</option>
  </select></label>
  <label>너비 <select name="width"><option>340</option><option>280</option><option>420</option></select></label>
  <button>적용 / 초기화</button>
</form>
<p id="instructions">확인 중…</p>
<iframe title="원본 확장 팝업"></iframe>
<section id="fixture" aria-label="읽을 예시 화면"></section>
<script type="module">
  import popupHtml from '../extension/popup.html?raw';
  import popupCss from '../extension/popup.css?raw';
  import popupSource from '../extension/popup.js?raw';
  import captureSource from '../extension/capture.js?raw';
  import backgroundSource from '../extension/background.js?raw';
  import exportSource from '../extension/export.js?raw';

  if (!import.meta.env.DEV) throw new Error('개발 서버에서만 실행하는 미리보기입니다.');
  const params = new URLSearchParams(location.search);
  for (const select of document.querySelectorAll('select')) {
    if ([...select.options].some(option => option.value === params.get(select.name))) select.value = params.get(select.name);
  }
  const form = document.querySelector('form');
  const scenario = form.elements.scenario.value;
  const frame = document.querySelector('iframe');
  frame.style.width = form.elements.width.value + 'px';
  const loaded = new Promise(resolve => frame.onload = resolve);
  frame.srcdoc = popupHtml.replace(/<link[^>]*>/, '').replace(/<script[\s\S]*?<\/script>/g, '');
  await loaded;
  const doc = frame.contentDocument;
  const style = doc.createElement('style'); style.textContent = popupCss; doc.head.append(style);

  // 지어낸 예시 화면. 중계기는 이 문서를 그 탭의 화면으로 읽는다.
  const fixture = document.getElementById('fixture');
  fixture.innerHTML = '<h2 id="mf_wfm_cntsHeader_spnHeaderTitle">입찰공고상세[내자]</h2><div id="mf_wfm_container_mainWframe"><table><tr><td data-title="공고명"><span class="w2textbox" id="preview-title">개발 예시 — 긴 공고명이 여러 줄로 표시되는지 확인하는 사무용 물품 구매 공고</span></td></tr></table></div>';
  const values = { 입찰공고번호: 'R26BK00000001 - 001', 공고종류: '실공고', 게시일시: '2026/09/24 10:00:00', 공고기관: '예시기관' };
  Object.entries(values).forEach(([label, value], index) => {
    const input = document.createElement('input');
    input.title = input.ariaLabel = label; input.value = value; input.readOnly = true; input.id = 'preview-field-' + index;
    fixture.querySelector('#mf_wfm_container_mainWframe').append(input);
  });
  // 실제 origin 이나 Chrome 권한을 바꾸지 않는다 — 단위 시험과 같은 함수 인자 대역이다. 화면 번호(ADR-037)는 지원 화면이면
  // 입찰공고 상세(01179), 수집 안 함이면 목록에 없는 번호라고 답한다.
  const fakeLocation = { origin: 'https://www.g2b.go.kr', pathname: '/preview' };
  const fakeWindow = { com: { gfnGetMenuNo: () => scenario === 'unsupported' ? '01175' : '01179' } };
  fakeWindow.top = fakeWindow;
  const profiles = [{ id: 'preview-notice', screen: { code: '01179', name: '입찰공고 상세' }, identitySource: 'pointInfo', baseField: 'reference', seqField: 'reference', tables: [],
    fields: [{ source: 'title' }], selectors: { reference: '#preview-field-0', title: '#preview-title' } }];
  const inPage = (source, ...args) => new Function('document', 'window', 'location', 'profiles', source)(document, fakeWindow, fakeLocation, ...args);
  const g2bTab = { id: 1, windowId: 1, title: '나라장터', url: fakeLocation.origin + '/preview' };
  const activeTab = scenario === 'elsewhere' ? { id: 2, windowId: 1, title: '다른 사이트', url: 'https://example.invalid/' } : g2bTab;
  const listeners = [];
  const chrome = {
    runtime: {
      id: 'preview', getURL: file => 'chrome-extension://preview/' + file, lastError: undefined,
      getManifest: () => ({ version: '0.10.0' }), reload() {},
      onMessage: { addListener: fn => listeners.push(fn) },
      sendMessage: message => new Promise(resolve => {
        if (listeners[0](message, { id: 'preview', url: chrome.runtime.getURL('popup.html') }, resolve) !== true) resolve(undefined);
      }),
      // 상시 연결 — 「연결 안 됨」 이면 호스트가 없다.
      connectNative: () => {
        if (scenario === 'offline') throw new Error('예시: 계약 목록이 꺼져 있음');
        return { postMessage() {}, disconnect() {}, onMessage: { addListener() {} }, onDisconnect: { addListener() {} } };
      },
      onStartup: { addListener() {} },
      openOptionsPage: () => { document.getElementById('instructions').textContent = '설정 창 열기 요청 (미리보기에서는 열지 않음)'; },
      sendNativeMessage: async (_host, request) => {
        await new Promise(resolve => setTimeout(resolve, 120));
        if (scenario === 'offline') throw new Error('예시: Native Host 없음');
        const result = request.method === 'hello' ? { datasetId: 'preview-memory-only', mapping: { profiles }, mappingRevision: 'v1',
          destination: 'D:\\예시\\예시자료.pclm', environment: 'development', extensionVersion: '0.10.0' } : undefined;
        return { protocolVersion: 2, requestId: request.requestId, ok: true, result };
      },
    },
    tabs: { query: async filter => filter?.active ? [activeTab] : [g2bTab], update: async () => ({}),
      onActivated: { addListener() {} }, onUpdated: { addListener() {} }, onRemoved: { addListener() {} } },
    windows: { WINDOW_ID_NONE: -1, update: async () => ({}), create: async () => ({}), onFocusChanged: { addListener() {} } },
    permissions: { contains: async () => true, onAdded: { addListener() {} }, onRemoved: { addListener() {} } },
    scripting: { executeScript: async args => {
      if (args.files) return [];
      if (!args.args && !String(args.func).includes('pclmExportPage')) return [{ result: document.getElementById('mf_wfm_cntsHeader_spnHeaderTitle').textContent }];
      if (args.args) {
        let menu = ''; try { menu = inPage(captureSource + ';return pclmScreenCode();'); } catch { /* 모른다 */ }
        try { return [{ result: { screen: '입찰공고 상세', menu, snapshot: inPage(captureSource + ';return pclmReadMapped(profiles);', args.args[0]) } }]; }
        catch (error) { return [{ result: { screen: '개찰 결과', menu, error: error.message, unsupported: Boolean(error.unsupported) } }]; }
      }
      try { return [{ result: { workbook: inPage(exportSource + ';return pclmExportPage();') } }]; }
      catch (error) { return [{ result: { error: error.message } }]; }
    } },
    storage: { onChanged: { addListener() {} }, local: { get: async () => ({ erpDevelopment: true }), set: async () => {} } },
  };
  new Function('chrome', backgroundSource)(chrome);
  // 중계기가 탭을 읽어 둘 틈을 준다 — 팝업은 열릴 때 읽어 둔 것만 본다.
  await new Promise(resolve => setTimeout(resolve, 400));
  await new Function('chrome', 'document', exportSource + '; return ' + popupSource)(chrome, doc);
  document.getElementById('instructions').textContent = '준비됨. 「설정」 과 「현재 화면 엑셀로 내보내기」 는 원본 단추 그대로입니다. 상황을 바꾸고 적용하면 처음부터 다시 그립니다.';
</script>
</html>
