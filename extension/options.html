<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>계약 목록 확장 설정</title><link rel="stylesheet" href="popup.css">
</head>
<body class="options">
  <main id="collector" class="options" aria-label="계약 목록 확장 설정">
    <header><h1>계약 목록 확장 설정</h1></header>
    <div id="content">
      <fieldset>
        <legend>연결 환경</legend>
        <label><input id="development" type="checkbox"> 개발 DB 사용</label>
        <p class="note">개발용 앱(<code>--erp-dev</code>)과 함께 쓸 때만 켭니다. 업무 DB에 저장하려면 끕니다.</p>
      </fieldset>
      <p id="saved" class="note" role="status" aria-live="polite"></p>
    </div>
  </main>
  <script src="options.js"></script>

</html>
