<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>계약 목록</title><link rel="stylesheet" href="popup.css">
</head>
<body>
  <main id="collector" aria-label="계약 목록 연결">
    <header>
      <h1>계약 목록 <span id="environment" class="badge"></span></h1>
      <button id="settings" class="quiet" type="button">설정</button>
    </header>
    <div id="content">
      <section class="connection" aria-label="연결 상태" aria-live="polite">
        <p id="connection" class="state" data-connected="">연결을 확인하고 있습니다.</p>
        <p id="destination" class="soft" hidden></p>
        <p id="tab" class="tab" hidden></p>
      </section>
      <section class="export" aria-label="화면 엑셀 내보내기">
        <button id="export" type="button" disabled>현재 화면 엑셀로 내보내기</button>
        <p id="export-status" class="soft" role="status" aria-live="polite"></p>
      </section>
    </div>
  </main>
  <script src="export.js"></script>
  <script src="popup.js"></script>
</body>
</html>
